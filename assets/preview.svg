<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Claude theme for OpenCode</title>
  <desc id="desc">Vista previa del tema: terminal cálido oscuro con acentos terracota, azul y salvia.</desc>
  <defs>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a9bcc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6a9bcc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22201e"/>
      <stop offset="100%" stop-color="#181716"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#141413"/>
  <circle cx="140" cy="110" r="280" fill="url(#orangeGlow)"/>
  <circle cx="1080" cy="590" r="300" fill="url(#blueGlow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="80" y="44" fill="#b0aea5" font-size="14" letter-spacing="3">CLAUDE THEME FOR OPENCODE</text>
    <text x="1120" y="44" fill="#6a9bcc" font-size="14" text-anchor="end">V2 · DARK + LIGHT</text>

    <rect x="80" y="70" width="1040" height="430" rx="18" fill="url(#panel)" stroke="#3a3935" filter="url(#shadow)"/>
    <line x1="80" y1="114" x2="1120" y2="114" stroke="#3a3935"/>
    <circle cx="112" cy="92" r="6" fill="#d15a4f"/>
    <circle cx="134" cy="92" r="6" fill="#e0b56e"/>
    <circle cx="156" cy="92" r="6" fill="#aec292"/>
    <text x="600" y="97" fill="#8a877e" font-size="14" text-anchor="middle">~/projects/claude-theme</text>

    <text x="118" y="154" font-size="18">
      <tspan fill="#6a9bcc" font-weight="700">~</tspan>
      <tspan fill="#d97757"> ❯ </tspan>
      <tspan fill="#faf9f5">opencode</tspan>
    </text>
    <text x="118" y="184" fill="#e8926f" font-size="18" font-weight="700">claude</text>
    <text x="196" y="184" fill="#b0aea5" font-size="16">warm dark · syntax · diffs · markdown</text>

    <text x="118" y="228" fill="#3a3935" font-size="17">╭──────────────────────────────────────────────────────────╮</text>
    <text x="118" y="256" font-size="17">
      <tspan fill="#3a3935">│ </tspan>
      <tspan fill="#6a9bcc" font-weight="700">You</tspan>
      <tspan fill="#d6d3ca">     copy this theme to another PC</tspan>
    </text>
    <text x="118" y="284" font-size="17">
      <tspan fill="#3a3935">│ </tspan>
      <tspan fill="#d97757" font-weight="700">Claude</tspan>
      <tspan fill="#d6d3ca">  package it as a portable repo.</tspan>
    </text>
    <text x="118" y="312" font-size="17">
      <tspan fill="#3a3935">│ </tspan>
      <tspan fill="#aec292" font-weight="700">✓</tspan>
      <tspan fill="#aec292"> theme validated</tspan>
      <tspan fill="#8a877e">   78 tokens · 0 errors</tspan>
    </text>
    <text x="118" y="340" font-size="17">
      <tspan fill="#3a3935">│ </tspan>
      <tspan fill="#e0b56e" font-weight="700">◆</tspan>
      <tspan fill="#e0b56e"> syntax</tspan>
      <tspan fill="#8a877e">       keyword </tspan>
      <tspan fill="#e8926f">theme</tspan>
      <tspan fill="#8a877e"> · </tspan>
      <tspan fill="#8fb3d9">install</tspan>
      <tspan fill="#8a877e">() · </tspan>
      <tspan fill="#aec292">"portable"</tspan>
    </text>
    <text x="118" y="368" fill="#3a3935" font-size="17">╰──────────────────────────────────────────────────────────╯</text>

    <text x="118" y="410" font-size="18">
      <tspan fill="#6a9bcc" font-weight="700">~</tspan>
      <tspan fill="#d97757"> ❯ </tspan>
      <tspan fill="#faf9f5">restart opencode</tspan>
      <tspan fill="#d97757">▊</tspan>
    </text>
    <text x="118" y="452" fill="#8a877e" font-size="14">theme.name = "claude"   theme.mode = "dark"   animations = true</text>

    <text x="80" y="548" fill="#8a877e" font-size="13" letter-spacing="3">PALETTE</text>

    <g>
      <rect x="80" y="566" width="128" height="54" rx="10" fill="#d97757"/>
      <text x="92" y="598" fill="#141413" font-size="14" font-weight="700">#d97757</text>
      <text x="80" y="642" fill="#b0aea5" font-size="13">accent</text>

      <rect x="224" y="566" width="128" height="54" rx="10" fill="#6a9bcc"/>
      <text x="236" y="598" fill="#141413" font-size="14" font-weight="700">#6a9bcc</text>
      <text x="224" y="642" fill="#b0aea5" font-size="13">interactive</text>

      <rect x="368" y="566" width="128" height="54" rx="10" fill="#aec292"/>
      <text x="380" y="598" fill="#141413" font-size="14" font-weight="700">#aec292</text>
      <text x="368" y="642" fill="#b0aea5" font-size="13">success</text>

      <rect x="512" y="566" width="128" height="54" rx="10" fill="#e0b56e"/>
      <text x="524" y="598" fill="#141413" font-size="14" font-weight="700">#e0b56e</text>
      <text x="512" y="642" fill="#b0aea5" font-size="13">warning</text>

      <rect x="656" y="566" width="128" height="54" rx="10" fill="#b8a3d4"/>
      <text x="668" y="598" fill="#141413" font-size="14" font-weight="700">#b8a3d4</text>
      <text x="656" y="642" fill="#b0aea5" font-size="13">syntax</text>

      <rect x="800" y="566" width="128" height="54" rx="10" fill="#eda9a3"/>
      <text x="812" y="598" fill="#141413" font-size="14" font-weight="700">#eda9a3</text>
      <text x="800" y="642" fill="#b0aea5" font-size="13">error</text>

      <rect x="944" y="566" width="176" height="54" rx="10" fill="#faf9f5"/>
      <text x="956" y="598" fill="#141413" font-size="14" font-weight="700">#faf9f5</text>
      <text x="944" y="642" fill="#b0aea5" font-size="13">text · light background</text>
    </g>

    <text x="80" y="680" fill="#8a877e" font-size="13">github.com/centimos01/Claude-theme-for-opencode</text>
    <text x="1120" y="680" fill="#8a877e" font-size="13" text-anchor="end">GPL-3.0 · no affiliation with Anthropic</text>
  </g>
</svg>
